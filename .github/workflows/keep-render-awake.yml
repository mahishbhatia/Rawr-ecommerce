name: Keep Render awake

on:
  schedule:
    # Queues every 5 minutes. 
    # Minimum allowed by GitHub Actions to help beat the 15-minute Render sleep timer.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the public health endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          test -n "$RENDER_APP_URL" || { echo "RENDER_APP_URL secret is not set"; exit 1; }
          curl --fail --silent --show-error --retry 2 --max-time 30 "$RENDER_APP_URL/healthz"
